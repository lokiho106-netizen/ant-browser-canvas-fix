<!doctype html><meta charset="utf-8"><title>Canvas probe running</title>
<pre id="result">running</pre>
<script>
try {
  let hash = 2166136261;
  let firstHash = null;
  let consistent = true;
  for (let run = 0; run < 250; run++) {
    const canvas = document.createElement('canvas');
    canvas.width = 320; canvas.height = 100;
    const context = canvas.getContext('2d');
    context.fillStyle = '#a2c496'; context.fillRect(0, 0, 320, 100);
    context.fillStyle = '#253144'; context.font = '18px Arial';
    context.fillText('Canvas verification 150', 11, 35);
    context.beginPath(); context.arc(275, 48, 31, 0, Math.PI * 2); context.fill();
    const pixels = context.getImageData(0, 0, 320, 100).data;
    let pixelHash = 2166136261;
    for (let i = 0; i < pixels.length; i++) pixelHash = Math.imul(pixelHash ^ pixels[i], 16777619) >>> 0;
    if (firstHash === null) firstHash = pixelHash;
    if (pixelHash !== firstHash) consistent = false;
    const uri = canvas.toDataURL();
    if (!uri.startsWith('data:image/png;base64,')) throw Error('Invalid PNG output');
    hash = Math.imul(hash ^ pixelHash ^ uri.length, 16777619) >>> 0;
  }
  document.getElementById('result').textContent = JSON.stringify({ok:true,reads:250,pixelHash:firstHash,consistent,combinedHash:hash});
  document.title = 'Canvas probe PASS';
} catch (error) {
  document.getElementById('result').textContent = String(error);
  document.title = 'Canvas probe FAIL';
}
</script>
